<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vibe Reset</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="../public/css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box glass-panel">
            <div class="login-header">
                <div class="brand-badge">
                    <i data-lucide="sparkles" class="badge-icon"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to resume your digital focus journey</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="input-icon"></i>
                        <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Authenticate <i data-lucide="key-round" class="btn-icon"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i data-lucide="arrow-left" class="inline-icon"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>

    <script>
        // 1. Safe Event Listener implementation that guarantees execution
        document.getElementById("login-form").addEventListener("submit", function(event) {
            // Instantly halt the form reload behavior before doing anything else
            event.preventDefault(); 
            
            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value;

            if (usernameInput && passwordInput) {
                // Redirect explicitly to dashboard.html sitting right next to it in the views directory
                window.location.href = "./dashboard.html";
            }
        });

        // 2. Wrap icon loading in a try/catch block so a failure here won't break the login logic
        try {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.warn("Lucide library didn't load yet; fallback text icons active.");
            }
        } catch (iconError) {
            console.error("Non-blocking icon render error:", iconError);
        }
    </script>
</body>
</html>
